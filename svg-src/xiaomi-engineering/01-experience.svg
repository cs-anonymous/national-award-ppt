<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FFFFFF"/><image href="assets/beihang-emblem.png" x="28" y="22" width="68" height="68" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="130" y="88" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="48px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">三、工程实践</text><rect x="448" y="48" width="2" height="48" rx="0" fill="#17263A" stroke="none" stroke-width="0" opacity="1"/><text x="478" y="86" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="40px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">实习经历与工作概况</text><text x="130" y="145" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="32px" font-weight="400" fill="#58708A"><tspan x="130" dy="0px">商汤 AI 应用与模型工具链研发 · TUM 知识图谱与可视化科研合作</tspan></text><text x="1872" y="1052" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#1675C8" text-anchor="end" opacity="1.0">01</text><rect x="48" y="194" width="896" height="826" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><rect x="976" y="194" width="896" height="826" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="80" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">商汤实习：AI 应用与基础设施核心开发</text><image href="assets/shangqi-screenshot.png" x="80" y="278" width="832" height="434" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="80" y="757" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">模型工具链  |  2021.06—2022.08</text><text x="80" y="802" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="400" fill="#17263A"><tspan x="80" dy="0px">独立开发 spring.remote，支持训练集群远程登录、</tspan><tspan x="80" dy="42.0px">任务提交与管理；开发系统监控工具，服务模型训练。</tspan></text><text x="80" y="898" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31px" font-weight="700" fill="#F39B45" text-anchor="start" opacity="1.0">AI 全栈工程  |  2023.02—2023.08</text><text x="80" y="943" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="400" fill="#17263A"><tspan x="80" dy="0px">参与“秒画”产品后端 API 设计与实现；独立开发</tspan><tspan x="80" dy="42.0px">Discord 机器人并上线官方社区，对接 AI 绘画接口。</tspan></text><text x="1008" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">TUM 科研访学：知识图谱与图可视化合作</text><image href="assets/tum-logo.png" x="1022" y="318" width="268" height="117" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/csc-letter.png" x="1060" y="450" width="177" height="250" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/maribel-acosta.jpg" x="1330" y="312" width="226" height="260" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/stephen-kobourov.jpg" x="1594" y="312" width="226" height="260" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="1008" y="757" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">国家公派科研访学  |  2025.09—2025.12</text><text x="1008" y="802" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="400" fill="#17263A"><tspan x="1008" dy="0px">Maribel Acosta：知识图谱与数据管理研究</tspan><tspan x="1008" dy="42.0px">Stephen Kobourov：图可视化与图绘制研究</tspan></text><text x="1008" y="898" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">研究合作与交流</text><text x="1008" y="943" font-family="