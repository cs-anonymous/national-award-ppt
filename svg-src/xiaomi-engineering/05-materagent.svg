<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FFFFFF"/><image href="assets/beihang-emblem.png" x="28" y="22" width="68" height="68" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="130" y="88" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="48px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">三、工程实践</text><rect x="448" y="48" width="2" height="48" rx="0" fill="#17263A" stroke="none" stroke-width="0" opacity="1"/><text x="478" y="86" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="40px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">MaterAgent：Harness 框架设计</text><text x="130" y="145" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="32px" font-weight="400" fill="#58708A"><tspan x="130" dy="0px">基于 pi-agent 修改，接入材料知识、领域工具与约束校验；核心开发：框架适配、编排与工具接口</tspan></text><text x="1872" y="1052" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#1675C8" text-anchor="end" opacity="1.0">05</text><image href="assets/materagent-stack.png" x="48" y="208" width="1102" height="810" preserveAspectRatio="xMidYMid meet" opacity="1"/><rect x="90" y="217" width="586" height="126" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="1"/><text x="108" y="251" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="33px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">服务入口与基础框架</text><text x="108" y="291" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="27px" font-weight="400" fill="#17263A"><tspan x="108" dy="0px">交互：飞书 / 钉钉 / 企业微信 / Web IDE</tspan><tspan x="108" dy="37.26px">API Gateway / FastAPI / REST / WebSocket</tspan></text><rect x="1178" y="194" width="694" height="826" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="1210" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">规划、工具执行与反馈机制</text><text x="1210" y="302" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">Query Router · 任务进入</text><text x="1210" y="344" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="400" fill="#17263A"><tspan x="1210" dy="0px">从问题提取任务类型、材料实体、工艺条件</tspan><tspan x="1210" dy="37.800000000000004px">与目标字段，生成后续执行所需的任务上下文。</tspan></text><text x="1210" y="436" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="700" fill="#F39B45" text-anchor="start" opacity="1.0">Plan Agent · 任务规划</text><text x="1210" y="478" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="400" fill="#17263A"><tspan x="1210" dy="0px">按任务规则确定检索、取证和预测步骤，</tspan><tspan x="1210" dy="37.800000000000004px">明确步骤依赖，组织工具输入和中间结果。</tspan></text><text x="1210" y="570" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">Tool Executor · 执行与观察</text><text x="1210" y="612" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="400" fill="#17263A"><tspan x="1210" dy="0px">调用数据库、论文读取和性能预测工具；</tspan><tspan x="1210" dy="37.800000000000004px">接收结构化结果，汇集材料记录与证据来源。</tspan></text><text x="1210" y="704" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">Verify Agent · 校验与终止</text><text x="1210" y="746" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="400" fill="#17263A"><tspan x="1210" dy="0px">按证据、输出格式、数值和完成条件校验；</tspan><tspan x="1210" dy="37.800000000000004px">满足条件则完成，否则反馈并调整执行计划。</tspan></text><line x1="1210" y1="815" x2="1840" y2="815" stroke="#C8DCEC" stroke-width="2"/><text x="1210" y="859" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">框架状态链路</text><text x="1210" y="902" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="400" fill="#17263A"><tspan x="1210" dy="0px">RUNNING → TOOL_CALL → OBSERVE</tspan><tspan x="1210" dy="39.199999999999996px">→ VERIFY → DONE / REPLAN</tspan></text><text x="1210" y="992" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="26px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">架构图展示整体设计；材料工具与编排持续开发中</text></svg>