<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FFFFFF"/><image href="assets/beihang-emblem.png" x="28" y="22" width="68" height="68" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="130" y="88" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="48px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">三、工程实践</text><rect x="448" y="48" width="2" height="48" rx="0" fill="#17263A" stroke="none" stroke-width="0" opacity="1"/><text x="478" y="86" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="40px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">材料数字化研发平台设计与实现：ITAS</text><text x="130" y="145" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="32px" font-weight="400" fill="#58708A"><tspan x="130" dy="0px">架构设计与核心开发：需求分析、模块划分、代码评审与合并；支持材料文献标注、数据生产与智能挖掘</tspan></text><text x="1872" y="1052" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#1675C8" text-anchor="end" opacity="1.0">03</text><rect x="48" y="194" width="926" height="826" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="80" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">真实工作台：论文阅读、段落标注与实体定位</text><image href="assets/itas-workbench.png" x="80" y="272" width="862" height="442" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/itas-material-annotation.png" x="80" y="730" width="444" height="218" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="assets/itas-entity-highlight.png" x="548" y="734" width="392" height="51" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="548" y="827" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">材料文献操作示例</text><text x="548" y="871" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="27px" font-weight="400" fill="#17263A"><tspan x="548" dy="0px">定位合成段落，标注 MOF 化学式、</tspan><tspan x="548" dy="38.339999999999996px">金属前驱体、溶剂与反应条件；</tspan><tspan x="548" dy="38.339999999999996px">核对实体后提交，审核并导出数据。</tspan></text><text x="80" y="992" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">管理员分配任务 → 标注员提交 → 审核与导出 → 科研人员使用</text><rect x="1006" y="194" width="866" height="826" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="1038" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#F39B45" text-anchor="start" opacity="1.0">系统模块与 PDF 到结构化数据的处理流程</text><image href="assets/itas-pdf-html.png" x="1038" y="280" width="802" height="135" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="1038" y="467" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">平台化协作与数据流</text><text x="1038" y="507" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="400" fill="#17263A"><tspan x="1038" dy="0px">分层架构：Web 工作台 → 标注/挖掘服务 → 数据与对象存储。</tspan><tspan x="1038" dy="38.86px">文本标注：项目管理、任务分配、实体标注、审核与导出。</tspan><tspan x="1038" dy="38.86px">智能挖掘：模型管理、段落提取、实体识别与记录管理。</tspan><tspan x="1038" dy="38.86px">数据流：PDF → HTML/TXT → 合成段落 → 材料实体</tspan><tspan x="1038" dy="38.86px">→ 人工校正与审核 → 导出结构化记录。</tspan></text><text x="1038" y="713" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="30px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">材料领域预设与数据字典</text><image href="assets/itas-material-dictionary.png" x="1040" y="736" width="408" height="186" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="1472" y="770" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="27px" font-weight="400" fill="#17263A"><tspan x="1472" dy="0px">实体：MOF、金属源、</tspan><tspan x="1472" dy="37.8px">有机配体、溶剂、调节剂</tspan><tspan x="1472" dy="37.8px">属性：时间、温度、用量</tspan><tspan x="1472" dy="37.8px">关系：来源、组成与操作</tspan></text><text x="1038" y="956" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="400" fill="#58708A"><tspan x="1038" dy="0px">预设约束标注范围与输出字段；结果可用于模型训练、</tspan><tspan x="1038" dy="39.150000000000006px">few-shot 示例整理与后续知识图谱构建。</tspan></text></svg>