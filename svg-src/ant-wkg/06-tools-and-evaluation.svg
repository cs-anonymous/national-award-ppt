<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FFFFFF"/><image href="../xiaomi-engineering/assets/beihang-emblem.png" x="28" y="22" width="68" height="68" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="130" y="88" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="48px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">三、工程实践</text><rect x="448" y="48" width="2" height="48" rx="0" fill="#17263A" stroke="none" stroke-width="0" opacity="1"/><text x="478" y="86" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="40px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">知识服务原子能力：检索、取证与质量评测</text><text x="130" y="145" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="32px" font-weight="400" fill="#58708A"><tspan x="130" dy="0px">Database MCP 与 Paper Browser MCP 将结构化数据、论文原文和证据元数据组织成可调用接口</tspan></text><text x="1872" y="1052" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#1675C8" text-anchor="end" opacity="1.0">06</text><rect x="48" y="194" width="896" height="330" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="80" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">Database MCP：结构化知识检索</text><text x="80" y="292" font-family="Consolas" font-size="30px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">material_db_hybrid_search</text><text x="80" y="338" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="400" fill="#17263A"><tspan x="80" dy="0px">输入：query / retrieval_method / top_k（1–20）。</tspan><tspan x="80" dy="39.150000000000006px">支持：hybrid / vector / bm25；dense / sparse 为别名。</tspan><tspan x="80" dy="39.150000000000006px">输出：排序记录、相关性分数、字段和来源元数据。</tspan><tspan x="80" dy="39.150000000000006px">精确筛选、数值比较和 Top-k 排序由数据库完成。</tspan></text><rect x="976" y="194" width="896" height="330" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="1008" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#F39B45" text-anchor="start" opacity="1.0">Paper Browser：论文证据读取</text><text x="1008" y="292" font-family="Consolas" font-size="30px" font-weight="700" fill="#F39B45" text-anchor="start" opacity="1.0">paper_search / paper_read</text><text x="1008" y="338" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="400" fill="#17263A"><tspan x="1008" dy="0px">按 DOI、标题、章节或正文定位论文。</tspan><tspan x="1008" dy="39.150000000000006px">用 paper_id / section_id 读取段落、表格和图注。</tspan><tspan x="1008" dy="39.150000000000006px">保留来源、读取位置和上下文，形成可复核证据。</tspan><tspan x="1008" dy="39.150000000000006px">将知识记录关联回论文原文，而不是只返回模型生成文本。</tspan></text><rect x="48" y="550" width="1824" height="245" rx="18" fill="#E6F1FA" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="80" y="598" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">端到端调用：从问题到带证据的回答</text><text x="80" y="642" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">问题：满足限定条件的材料/实体，哪一个结果最好？依据来自哪里？</text><rect x="80" y="680" width="328" height="86" rx="12" fill="#F1F6FB" stroke="#1675C8" stroke-width="2" opacity="1"/><text x="96" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">1</text><text x="134" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">意图识别</text><text x="96" y="750" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">实体 / 条件 / 目标</text><line x1="412" y1="723" x2="427" y2="723" stroke="#C8DCEC" stroke-width="3"/><polygon points="424,716 434,723 424,730" fill="#C8DCEC"/><rect x="436" y="680" width="328" height="86" rx="12" fill="#F1F6FB" stroke="#F39B45" stroke-width="2" opacity="1"/><text x="452" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="700" fill="#F39B45" text-anchor="start" opacity="1.0">2</text><text x="490" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">数据库检索</text><text x="452" y="750" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">过滤 / 排序 / 去重</text><line x1="768" y1="723" x2="783" y2="723" stroke="#C8DCEC" stroke-width="3"/><polygon points="780,716 790,723 780,730" fill="#C8DCEC"/><rect x="792" y="680" width="328" height="86" rx="12" fill="#F1F6FB" stroke="#0E9DB4" stroke-width="2" opacity="1"/><text x="808" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">3</text><text x="846" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">论文补证</text><text x="808" y="750" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">定位原文段落</text><line x1="1124" y1="723" x2="1139" y2="723" stroke="#C8DCEC" stroke-width="3"/><polygon points="1136,716 1146,723 1136,730" fill="#C8DCEC"/><rect x="1148" y="680" width="328" height="86" rx="12" fill="#F1F6FB" stroke="#0E9DB4" stroke-width="2" opacity="1"/><text x="1164" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">4</text><text x="1202" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">证据合并</text><text x="1164" y="750" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">记录 / 分数 / 来源</text><line x1="1480" y1="723" x2="1495" y2="723" stroke="#C8DCEC" stroke-width="3"/><polygon points="1492,716 1502,723 1492,730" fill="#C8DCEC"/><rect x="1504" y="680" width="328" height="86" rx="12" fill="#F1F6FB" stroke="#C94B56" stroke-width="2" opacity="1"/><text x="1520" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="29px" font-weight="700" fill="#C94B56" text-anchor="start" opacity="1.0">5</text><text x="1558" y="715" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">校验输出</text><text x="1520" y="750" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">条件 / 单位 / 引用</text><rect x="48" y="822" width="1824" height="198" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="80" y="868" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="32px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">QA benchmark：让知识服务可评测、可回归</text><text x="80" y="914" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="31px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">10 个任务 · 100 道题</text><text x="470" y="914" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">单条查询 · 条件筛选与排序 · 工艺归纳 · 论文取证 · 机理分析</text><text x="80" y="967" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="27px" font-weight="700" fill="#F39B45" text-anchor="start" opacity="1.0">评测对象</text><text x="260" y="967" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="27px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">意图识别、核心结果、来源追溯、条件核对和材料补充；结果进入后续迭代。</text></svg>