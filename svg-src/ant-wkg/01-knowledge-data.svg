<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FFFFFF"/><image href="../xiaomi-engineering/assets/beihang-emblem.png" x="28" y="22" width="68" height="68" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="130" y="88" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="48px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">三、工程实践</text><rect x="448" y="48" width="2" height="48" rx="0" fill="#17263A" stroke="none" stroke-width="0" opacity="1"/><text x="478" y="86" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="40px" font-weight="700" fill="#17263A" text-anchor="start" opacity="1.0">材料数据库与知识图谱构建</text><text x="130" y="145" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="32px" font-weight="400" fill="#58708A"><tspan x="130" dy="0px">主导知识图谱、本体与可视化模块开发；融合文献、结构、性能与实验数据，支撑材料研发任务</tspan></text><text x="1872" y="1052" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="700" fill="#1675C8" text-anchor="end" opacity="1.0">01</text><rect x="48" y="194" width="866" height="826" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="80" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">多源异构数据融合与研发任务</text><image href="../xiaomi-engineering/assets/mofkg/fig2-workflow.png" x="76" y="272" width="810" height="382" preserveAspectRatio="xMidYMid meet" opacity="1"/><image href="../xiaomi-engineering/assets/mofkg/fig1-data-sources.png" x="76" y="662" width="810" height="210" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="80" y="903" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="400" fill="#17263A"><tspan x="80" dy="0px">数据来源：文献、KAIST、QMOF、CoRE、CSD、PubChem，</tspan><tspan x="80" dy="35.84px">以及高通量计算与合成实验；统一结构、性能和合成条件。</tspan><tspan x="80" dy="35.84px">围绕合成参数—结构—性能关系，开展逆合成、</tspan><tspan x="80" dy="35.84px">构效关系挖掘、逆向结构设计与合成参数优化。</tspan></text><rect x="942" y="194" width="930" height="826" rx="18" fill="#F1F6FB" stroke="#C8DCEC" stroke-width="2" opacity="1"/><text x="974" y="246" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="34px" font-weight="700" fill="#F39B45" text-anchor="start" opacity="1.0">材料知识图谱：本体建模与 Neo4j 可视化</text><image href="../xiaomi-engineering/assets/expath-neo4j.png" x="970" y="274" width="628" height="440" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="1620" y="306" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="27px" font-weight="700" fill="#0E9DB4" text-anchor="start" opacity="1.0">材料本体</text><image href="../xiaomi-engineering/assets/MOFKG-onto.png" x="1620" y="326" width="220" height="125" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="1620" y="496" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="27px" font-weight="700" fill="#1675C8" text-anchor="start" opacity="1.0">节点与关系统计</text><image href="../xiaomi-engineering/assets/mofkg-statistic.png" x="1610" y="520" width="236" height="158" preserveAspectRatio="xMidYMid meet" opacity="1"/><text x="974" y="750" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="28px" font-weight="400" fill="#17263A"><tspan x="974" dy="0px">本体：MOF、前驱体、结构单元、合成操作与论文。</tspan><tspan x="974" dy="38.64px">关系：合成、组成、操作条件和文献来源；保留投料量等属性。</tspan><tspan x="974" dy="38.64px">融合：用名称、分子式、结构与标识符对齐多源实体。</tspan><tspan x="974" dy="38.64px">质量与追踪：筛除重复及低质数据，区分标注、抽取与推理来源。</tspan><tspan x="974" dy="38.64px">交互：在 Neo4j 查看关联材料、节点属性、结构及来源分布。</tspan><tspan x="974" dy="38.64px">合成条件 46,701 条 · DOI 非空 46,486 条 · 唯一 DOI 17,715 个</tspan></text><text x="974" y="1005" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22px" font-weight="400" fill="#58708A" text-anchor="start" opacity="1.0">Neo4j 原图：eXpath presentation（12页）.pptx，第 1 页</text></svg>